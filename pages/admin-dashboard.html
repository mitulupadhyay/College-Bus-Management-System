<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Admin Dashboard — CampusTransit</title>
<link rel="stylesheet" href="../dist/output.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-surface text-slate-800">

<div id="appShell"></div>

<template id="tpl-overview">
  <div class="space-y-6">
    <div class="page-header">
      <div>
        <h2 class="page-title">Fleet Overview</h2>
        <p class="page-subtitle">Monday, 16 Aug 2026 · Live snapshot</p>
      </div>
      <div class="page-actions">
        <button class="btn-secondary btn-sm" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
        <button class="btn-primary btn-sm" id="addBusBtnTop"><i class="fa-solid fa-plus"></i> Add Bus</button>
      </div>
    </div>

    <!-- Operations Center — the wow moment -->
    <div class="ops-center-grid">
      <div class="vis-card ops-slot-left-1">
        <div class="vis-card-head">
          <div><p class="vis-card-title">Fleet Status</p><p class="vis-card-sub">Active GPS vehicles</p></div>
          <i class="fa-solid fa-ellipsis vis-card-menu"></i>
        </div>
        <div class="flex-1 flex items-center justify-center py-2">
          <div class="fleet-status-ring">
            <span class="fleet-status-ring-value" id="opsActiveCount">4</span>
            <span class="fleet-status-ring-label">Active</span>
          </div>
        </div>
        <div class="flex items-center justify-center gap-4 text-xs text-slate-500">
          <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-success-500"></span>Active</span>
          <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-warning-500"></span>Delayed</span>
        </div>
      </div>

      <div class="vis-card ops-slot-left-2">
        <div class="vis-card-head">
          <div><p class="vis-card-title">Student Boarding</p><p class="vis-card-sub">Live QR check-ins today</p></div>
          <i class="fa-solid fa-ellipsis vis-card-menu"></i>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center py-2">
          <p class="text-3xl font-bold font-mono text-slate-900" id="opsBoardedCount">4</p>
          <p class="text-xs text-slate-400 mt-1">students boarded</p>
        </div>
        <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full bg-accent-500" id="opsBoardedBar" style="width:67%"></div>
        </div>
      </div>

      <div class="ops-center-visual">
        <div class="ops-visual-frame">
          <svg viewBox="0 0 400 180" class="ops-route-svg" preserveAspectRatio="none">
            <path d="M0,140 C80,100 140,160 200,110 C260,60 320,120 400,70" stroke="#c7d2fe" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
          </svg>
          <div class="ops-bus-illustration">
            <i class="fa-solid fa-bus"></i>
          </div>
          <span class="callout-tag" style="left:6%; top:10%;"><span class="callout-label">Engine</span><span class="callout-value-ok">Optimal</span></span>
          <span class="callout-tag" style="right:6%; top:14%;"><span class="callout-label">AC</span><span class="callout-value-ok">Functioning</span></span>
          <span class="callout-tag" style="left:10%; bottom:12%;"><span class="callout-label">Tires</span><span class="callout-value-ok">Functioning</span></span>
          <span class="callout-tag" style="right:8%; bottom:16%;"><span class="callout-label">Capacity</span><span class="callout-value-ok">38 / 45</span></span>
        </div>
        <p class="ops-visual-caption">BUS-007 · Route A · Live diagnostics (mock)</p>
      </div>

      <div class="vis-card ops-slot-right-1">
        <div class="vis-card-head">
          <div><p class="vis-card-title">Route Efficiency</p><p class="vis-card-sub">Actual vs. estimated</p></div>
          <i class="fa-solid fa-ellipsis vis-card-menu"></i>
        </div>
        <div id="opsEfficiencyChart" class="flex-1 flex items-end gap-1.5 min-h-[110px]"></div>
      </div>

      <div class="vis-card ops-slot-right-2">
        <div class="vis-card-head">
          <div><p class="vis-card-title">Emergency SOS</p><p class="vis-card-sub">Live alert monitor</p></div>
          <i class="fa-solid fa-ellipsis vis-card-menu"></i>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center py-2 gap-2">
          <div class="siren-icon"><span class="siren-ring"></span><i class="fa-solid fa-triangle-exclamation"></i></div>
          <p class="text-xs text-slate-400">No active emergencies</p>
        </div>
      </div>
    </div>

    <!-- KPI cards -->
    <div id="kpiGrid" class="kpi-grid"></div>

    <!-- Live operations -->
    <div class="split-grid">
      <div class="xl:col-span-3 card card-pad">
        <div class="live-panel-head">
          <h3 class="font-semibold text-slate-800">Live Fleet Map</h3>
          <span class="live-badge"><span class="pulse-dot bg-success-500"></span> Live</span>
        </div>
        <div id="mockMap" class="live-map-frame">
          <svg class="live-map-route" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M0,70 Q25,40 50,55 T100,30" stroke="#94a3b8" stroke-width="0.6" fill="none" stroke-dasharray="1.5,1.5"/>
            <path d="M0,20 Q30,60 60,45 T100,80" stroke="#94a3b8" stroke-width="0.6" fill="none" stroke-dasharray="1.5,1.5"/>
            <circle cx="88" cy="30" r="2.2" fill="#6366f1"/>
          </svg>
          <div id="mapMarkers" class="absolute inset-0"></div>
          <div class="live-map-note">Mock visualization · GPS integration planned for Phase 2</div>
        </div>
      </div>

      <div class="xl:col-span-2 card card-pad flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-slate-800">Live Fleet</h3>
        </div>
        <div id="fleetFilters" class="flex gap-1.5 mb-3 flex-wrap"></div>
        <div id="liveFleetList" class="space-y-2.5 overflow-y-auto max-h-[420px] pr-1"></div>
      </div>
    </div>

    <!-- Attendance + trend -->
    <div class="three-col-grid">
      <div class="lg:col-span-2 card card-pad">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-slate-800">Attendance Trend — Last 7 Days</h3>
          <span class="text-xs text-slate-400">% present</span>
        </div>
        <div id="trendChart" class="mini-bar-chart"></div>
      </div>
      <div class="card card-pad">
        <h3 class="font-semibold text-slate-800 mb-4">Pending Approvals</h3>
        <div id="pendingList" class="space-y-3"></div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-fleet">
  <div class="space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Fleet Management</h2>
        <p class="text-sm text-slate-500 mt-0.5">Manage buses, drivers, and conductor assignments</p>
      </div>
      <button class="btn-primary btn-sm self-start" id="addBusBtn"><i class="fa-solid fa-plus"></i> Add Bus</button>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Bus ID</th><th>Registration</th><th>Route</th><th>Driver</th><th>Conductor</th>
            <th>Capacity</th><th>Occupancy</th><th>Status</th><th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="fleetTableBody"></tbody>
      </table>
    </div>
  </div>
</template>

<template id="tpl-routes">
  <div class="space-y-5">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Route Management</h2>
      <p class="text-sm text-slate-500 mt-0.5">Stop sequencing, distances and ETA — optimized via Dijkstra's shortest-path</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6" id="routesGrid"></div>
  </div>
</template>

<template id="tpl-attendance">
  <div class="space-y-5">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Attendance Analytics</h2>
      <p class="text-sm text-slate-500 mt-0.5">Captured automatically via QR scan at boarding</p>
    </div>
    <div id="attKpiGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Student</th><th>ID</th><th>Bus</th><th>Boarding Time</th><th>Date</th><th>Status</th></tr></thead>
        <tbody id="attendanceTableBody"></tbody>
      </table>
    </div>
  </div>
</template>

<template id="tpl-leaves">
  <div class="space-y-5">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Leave Requests</h2>
      <p class="text-sm text-slate-500 mt-0.5">Review and act on student leave applications</p>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Student</th><th>Type</th><th>Date</th><th>Reason</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
        <tbody id="leavesTableBody"></tbody>
      </table>
    </div>
  </div>
</template>

<template id="tpl-complaints">
  <div class="space-y-5">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Complaints</h2>
      <p class="text-sm text-slate-500 mt-0.5">Track and resolve reported issues</p>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Student</th><th>Bus</th><th>Subject</th><th>Date</th><th>Status</th></tr></thead>
        <tbody id="complaintsTableBody"></tbody>
      </table>
    </div>
  </div>
</template>

<template id="tpl-empty-generic">
  <div class="card card-pad flex flex-col items-center justify-center text-center py-16">
    <div class="w-14 h-14 rounded-2xl bg-accent-50 text-accent-500 flex items-center justify-center text-xl mb-4">
      <i class="fa-solid fa-clock"></i>
    </div>
    <h3 class="font-semibold text-slate-800 mb-1">Module coming soon</h3>
    <p class="text-sm text-slate-500 max-w-sm">This section is scaffolded for the next phase of the build. Backend integration will populate this view.</p>
  </div>
</template>

<script src="../js/mock-data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
