<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BusFlow admin control center — fleet, routes, students, attendance and reports." />
  <meta name="theme-color" content="#06070a" />
  <title>BusFlow · Admin Control Center</title>

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../dist/output.css" />
</head>

<body class="min-h-screen bg-void text-hi">
  <a class="sr-only-focusable" href="#view">Skip to main content</a>

  <div class="flex min-h-screen">
    <div id="sidebarScrim" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm lg:hidden" hidden></div>

    <aside id="sidebar"
           class="ease-premium fixed inset-y-0 left-0 z-50 flex w-[17rem] -translate-x-full flex-col border-r border-line bg-panel/95 backdrop-blur-xl transition-transform duration-300 lg:sticky lg:top-0 lg:h-screen lg:translate-x-0"
           aria-label="Sidebar navigation"></aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header id="topbar"
              class="sticky top-0 z-30 flex h-16 shrink-0 items-center gap-3 border-b border-line bg-ink/85 px-4 backdrop-blur-xl sm:px-6"></header>

      <main id="view" class="flex-1 px-4 py-6 sm:px-6 lg:px-8" tabindex="-1"></main>

      <footer class="border-t border-line px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-faint">BusFlow · admin console · prototype build</p>
          <div class="flex items-center gap-3 font-mono text-[10px] uppercase tracking-[0.16em] text-faint">
            <span class="flex items-center gap-1.5"><span class="live-dot"></span>Telemetry stream</span>
            <button class="transition-colors hover:text-mid" data-sim-toggle>Pause simulation</button>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/qr.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/fleetmap.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
