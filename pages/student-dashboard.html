<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Student Dashboard — CampusTransit</title>
<link rel="stylesheet" href="../dist/output.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-surface text-slate-800">

<div id="appShell"></div>

<template id="tpl-overview">
  <div class="space-y-6">
    <!-- Hero -->
    <div class="hero-panel">
      <p class="hero-eyebrow">Good Morning, <span class="font-semibold text-white">Mitul</span></p>
      <h2 class="hero-title">Your bus is currently 8 minutes away</h2>
      <div class="flex flex-wrap items-center gap-4 mt-4 text-sm relative">
        <span class="hero-chip">BUS-007</span>
        <span class="text-slate-300">Route: Bhimtal → College</span>
      </div>
      <div class="hero-stats-row">
        <div>
          <p class="hero-stat-value">08<span class="text-sm font-normal text-slate-400"> min</span></p>
          <p class="hero-stat-label">ETA</p>
        </div>
        <div>
          <p class="text-base sm:text-lg font-semibold">Bhimtal Market</p>
          <p class="hero-stat-label">Next Stop</p>
        </div>
      </div>
    </div>

    <!-- Live tracking card -->
    <div class="card card-pad">
      <div class="live-panel-head">
        <h3 class="font-semibold text-slate-800">Live Tracking</h3>
        <span class="live-badge"><span class="pulse-dot bg-success-500"></span>Live</span>
      </div>
      <div class="live-map-frame mb-4">
        <svg class="live-map-route" viewBox="0 0 100 100" preserveAspectRatio="none">
          <path d="M5,85 Q30,60 50,50 T95,15" stroke="#94a3b8" stroke-width="0.8" fill="none" stroke-dasharray="1.5,1.5"/>
        </svg>
        <div id="studentBusMarker" class="absolute -translate-x-1/2 -translate-y-1/2 transition-all duration-[3500ms] ease-linear" style="left:35%; top:65%;">
          <div class="bus-marker bus-marker-running"><i class="fa-solid fa-bus text-white text-xs"></i></div>
        </div>
        <div class="absolute right-2 top-2 sm:right-4 sm:top-4 stop-marker !w-4 !h-4 flex items-center justify-center">
          <i class="fa-solid fa-graduation-cap text-accent-600 text-[8px]"></i>
        </div>
      </div>
      <div class="live-stat-grid">
        <div class="live-stat-cell"><p class="live-stat-value" id="studentEta">08 min</p><p class="live-stat-label">ETA</p></div>
        <div class="live-stat-cell"><p class="live-stat-value">38/45</p><p class="live-stat-label">Occupancy</p></div>
        <div class="live-stat-cell"><p class="live-stat-value">Running</p><p class="live-stat-label">Status</p></div>
      </div>
    </div>

    <!-- My bus details -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
      <div class="card card-pad">
        <h3 class="font-semibold text-slate-800 mb-4">My Bus</h3>
        <div class="space-y-3 text-sm">
          <div class="flex justify-between"><span class="text-slate-400">Bus</span><span class="font-mono font-medium text-slate-800">BUS-007</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Route</span><span class="font-medium text-slate-800">Route A</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Driver</span><span class="font-medium text-slate-800">Rahul Sharma</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Conductor</span><span class="font-medium text-slate-800">Amit Kumar</span></div>
        </div>
      </div>
      <div class="card card-pad">
        <h3 class="font-semibold text-slate-800 mb-4">This Week's Attendance</h3>
        <div id="studentAttWeek" class="flex items-end gap-2 h-24"></div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-pass">
  <div class="space-y-5 max-w-md">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Digital Bus Pass</h2>
      <p class="text-sm text-slate-500 mt-0.5">Show this QR to the conductor at boarding</p>
    </div>
    <div class="rounded-2xl overflow-hidden shadow-xl border border-slate-200">
      <div class="bg-gradient-to-br from-navy-900 to-accent-700 text-white p-5 relative">
        <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
        <p class="text-[10px] tracking-widest uppercase text-slate-300 mb-1">College Transport Pass</p>
        <h3 class="text-lg font-bold">Mitul Upadhyay</h3>
        <p class="text-xs font-mono text-slate-300 mt-0.5">GEHU2026A101</p>
      </div>
      <div class="bg-white p-5">
        <div class="flex justify-center mb-5">
          <div id="qrCodeGrid" class="w-40 h-40 bg-white border border-slate-200 rounded-xl p-2 grid grid-cols-8 grid-rows-8 gap-0.5" aria-label="QR code"></div>
        </div>
        <div class="grid grid-cols-2 gap-3 text-sm mb-5">
          <div><p class="text-xs text-slate-400">Route</p><p class="font-medium text-slate-800">Route A</p></div>
          <div><p class="text-xs text-slate-400">Bus</p><p class="font-mono font-medium text-slate-800">BUS-007</p></div>
          <div class="col-span-2"><p class="text-xs text-slate-400">Valid</p><p class="font-medium text-slate-800">2026–2027</p></div>
        </div>
        <button class="btn-primary w-full" onclick="showToast('Pass downloaded as PDF', 'success')"><i class="fa-solid fa-download"></i> Download Pass</button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-leave">
  <div class="space-y-5">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Leave Request</h2>
      <p class="text-sm text-slate-500 mt-0.5">Let the transport team know when you won't need the bus</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
      <div class="card card-pad">
        <form id="leaveForm" class="space-y-4">
          <div>
            <label class="field-label">Leave Type</label>
            <div class="grid grid-cols-2 gap-2" id="leaveTypeGrid">
              ${["Morning", "Evening", "Full Day", "No Bus"].map((t, i) => `
                <button type="button" data-type="${t}" class="leave-type-btn px-3 py-2.5 rounded-lg border text-sm font-medium transition-colors ${i === 0 ? "bg-accent-600 text-white border-accent-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"}">${t}</button>
              `).join("")}
            </div>
          </div>
          <div>
            <label class="field-label" for="leaveDate">Date</label>
            <input type="date" id="leaveDate" class="input" required />
          </div>
          <div>
            <label class="field-label" for="leaveReason">Reason</label>
            <input type="text" id="leaveReason" class="input" placeholder="e.g. Doctor appointment" required />
          </div>
          <div>
            <label class="field-label" for="leaveNote">Additional Note (optional)</label>
            <textarea id="leaveNote" rows="2" class="input"></textarea>
          </div>
          <button type="submit" class="btn-primary w-full">Submit Request</button>
        </form>
      </div>
      <div class="card card-pad">
        <h3 class="font-semibold text-slate-800 mb-4">Request History</h3>
        <div id="leaveHistoryList" class="space-y-3"></div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-sos">
  <div class="space-y-5 max-w-lg">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Emergency SOS</h2>
      <p class="text-sm text-slate-500 mt-0.5">For use only in genuine emergencies</p>
    </div>
    <div class="card card-pad text-center border-2 border-danger-100">
      <div class="w-16 h-16 rounded-2xl bg-danger-50 text-danger-500 flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 class="font-semibold text-slate-800 mb-1">Need immediate help?</h3>
      <p class="text-sm text-slate-500 mb-6">This will alert transport admin, your driver, and college security instantly.</p>
      <button id="sosBtn" class="w-full py-4 rounded-2xl bg-danger-500 hover:bg-danger-600 active:scale-[0.98] text-white font-bold text-lg tracking-wide transition-all shadow-lg shadow-danger-500/30">
        <i class="fa-solid fa-bullhorn mr-2"></i>SEND SOS
      </button>
    </div>
  </div>
</template>

<template id="tpl-complaints">
  <div class="space-y-5">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Complaints</h2>
        <p class="text-sm text-slate-500 mt-0.5">Report an issue with your route or bus</p>
      </div>
      <button class="btn-primary btn-sm" id="newComplaintBtn"><i class="fa-solid fa-plus"></i> New</button>
    </div>
    <div id="studentComplaintsList" class="space-y-3"></div>
  </div>
</template>

<template id="tpl-empty-generic">
  <div class="card card-pad flex flex-col items-center justify-center text-center py-16">
    <div class="w-14 h-14 rounded-2xl bg-accent-50 text-accent-500 flex items-center justify-center text-xl mb-4">
      <i class="fa-solid fa-clock"></i>
    </div>
    <h3 class="font-semibold text-slate-800 mb-1">Module coming soon</h3>
    <p class="text-sm text-slate-500 max-w-sm">This section will connect to the live backend in the next phase.</p>
  </div>
</template>

<script src="../js/mock-data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/app.js"></script>
<script src="../js/student.js"></script>
</body>
</html>
