<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Driver Dashboard — CampusTransit</title>
<link rel="stylesheet" href="../dist/output.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-surface text-slate-800">

<div id="appShell"></div>

<template id="tpl-home">
  <div class="max-w-2xl mx-auto space-y-5">

    <!-- Pre-trip state -->
    <div id="preTripView" class="card card-pad text-center py-10">
      <div class="w-16 h-16 rounded-2xl bg-accent-50 text-accent-600 flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid fa-bus"></i>
      </div>
      <p class="font-mono text-lg font-bold text-slate-900">BUS-007</p>
      <p class="text-sm text-slate-500 mb-6">Route A · Bhimtal → College</p>
      <button id="startTripBtn" class="w-full py-5 rounded-2xl bg-success-500 hover:bg-success-600 active:scale-[0.98] text-white font-bold text-xl tracking-wide transition-all shadow-lg shadow-success-500/30">
        <i class="fa-solid fa-play mr-2"></i>START TRIP
      </button>
    </div>

    <!-- Active trip state -->
    <div id="activeTripView" class="hidden space-y-5">
      <div class="card card-pad bg-gradient-to-br from-navy-900 to-navy-700 text-white">
        <div class="flex items-center justify-between mb-4">
          <span class="flex items-center gap-1.5 text-xs font-semibold text-success-400"><span class="pulse-dot bg-success-400"></span>TRIP ACTIVE</span>
          <span class="font-mono text-xs text-slate-300">BUS-007 · Route A</span>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <p class="text-3xl font-bold font-mono" id="driverOccupancy">38/45</p>
            <p class="text-xs text-slate-400 mt-1">Students Onboard</p>
          </div>
          <div>
            <p class="text-3xl font-bold font-mono" id="driverEta">08 min</p>
            <p class="text-xs text-slate-400 mt-1">ETA · Next: Bhimtal Market</p>
          </div>
        </div>
      </div>

      <div class="card card-pad">
        <p class="field-label mb-3">Update Status</p>
        <div class="grid grid-cols-3 gap-2" id="driverStatusButtons"></div>
      </div>

      <button id="emergencyBtn" class="w-full py-4 rounded-2xl bg-danger-500 hover:bg-danger-600 active:scale-[0.98] text-white font-bold text-base transition-all shadow-lg shadow-danger-500/30">
        <i class="fa-solid fa-triangle-exclamation mr-2"></i>REPORT EMERGENCY
      </button>

      <div class="card card-pad">
        <h3 class="font-semibold text-slate-800 mb-3">Student Manifest</h3>
        <div class="table-wrap !shadow-none !border-slate-100">
          <table class="data-table">
            <thead><tr><th>Student</th><th>Stop</th><th>Boarded</th><th>Time</th></tr></thead>
            <tbody id="manifestBody"></tbody>
          </table>
        </div>
      </div>

      <button id="endTripBtn" class="w-full py-4 rounded-2xl bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-bold text-base transition-all">
        <i class="fa-solid fa-stop mr-2"></i>END TRIP
      </button>
    </div>
  </div>
</template>

<script src="../js/mock-data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/app.js"></script>
<script src="../js/driver.js"></script>
</body>
</html>
